name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks over full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact

  shellcheck:
    name: ShellCheck (scripts/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning scripts/*.sh

  ansible-syntax:
    name: Ansible syntax check (install/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible-core and collections
        run: |
          pipx install ansible-core || pip install --user ansible-core
          ansible-galaxy collection install -r install/requirements.yml
      - name: Syntax check
        working-directory: install
        run: ansible-playbook --syntax-check site.yml
