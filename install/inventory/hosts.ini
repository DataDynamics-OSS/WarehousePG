# WarehousePG 클러스터 인벤토리 예시
#
# coordinator  : 코디네이터(마스터) 노드 1대
# standby      : 대기 코디네이터(선택) 1대
# segments     : 세그먼트 호스트들
#
# 모든 노드는 [whpg_cluster:children]로 묶여 공통 준비/설치 대상이 됩니다.
# ansible_host에는 접속용 IP/호스트명을, 각 노드에는 클러스터 내부에서
# 서로를 부를 이름(가급적 /etc/hosts 또는 DNS로 해석되는 이름)을 씁니다.

[coordinator]
cdw ansible_host=192.168.10.10

[standby]
scdw ansible_host=192.168.10.11

[segments]
sdw1 ansible_host=192.168.10.21
sdw2 ansible_host=192.168.10.22

[whpg_cluster:children]
coordinator
standby
segments

[whpg_cluster:vars]
ansible_user=root
