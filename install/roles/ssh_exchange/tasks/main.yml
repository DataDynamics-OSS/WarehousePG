---
# gpadmin 계정의 노드 간 무암호 SSH(all-to-all) 구성.
# 각 노드에서 키를 생성하고, 모든 노드의 공개키를 모아 모든 노드에 등록합니다.

- name: gpadmin .ssh 디렉터리 준비
  ansible.builtin.file:
    path: "/home/{{ gpadmin_user }}/.ssh"
    state: directory
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0700'

- name: gpadmin SSH 키 생성(없으면)
  become: true
  become_user: "{{ gpadmin_user }}"
  ansible.builtin.command:
    cmd: ssh-keygen -t rsa -b 4096 -N '' -f /home/{{ gpadmin_user }}/.ssh/id_rsa
    creates: "/home/{{ gpadmin_user }}/.ssh/id_rsa"

- name: 각 노드의 공개키 읽기
  ansible.builtin.slurp:
    src: "/home/{{ gpadmin_user }}/.ssh/id_rsa.pub"
  register: gpadmin_pubkey

- name: 모든 노드의 공개키를 authorized_keys 에 등록(all-to-all)
  ansible.posix.authorized_key:
    user: "{{ gpadmin_user }}"
    key: "{{ hostvars[item].gpadmin_pubkey.content | b64decode | trim }}"
    state: present
  loop: "{{ groups['whpg_cluster'] }}"

- name: gpadmin SSH 클라이언트 설정(클러스터 내부 호스트 확인 생략)
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "/home/{{ gpadmin_user }}/.ssh/config"
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0600'
