---
# PXF RPM 설치 (모든 노드). GPHOME 등록은 클러스터가 떠 있어야 하므로
# cluster_init 단계(또는 수동)에서 'pxf cluster register'로 수행합니다.

- name: PXF RPM 출처 판별
  ansible.builtin.set_fact:
    pxf_use_url: "{{ pxf_rpm_url | length > 0 }}"

- name: PXF RPM 전송(로컬 파일)
  ansible.builtin.copy:
    src: "{{ pxf_rpm_file }}"
    dest: "/tmp/{{ pxf_rpm_file }}"
    mode: '0644'
  when: not pxf_use_url

- name: PXF RPM 설치
  ansible.builtin.dnf:
    name: "{{ pxf_rpm_url if pxf_use_url else '/tmp/' + pxf_rpm_file }}"
    state: present
    disable_gpg_check: true

- name: PXF_HOME 소유권을 gpadmin 으로 변경
  ansible.builtin.file:
    path: "{{ pxf_home }}"
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    recurse: true

- name: PXF_BASE 디렉터리 준비
  ansible.builtin.file:
    path: "{{ pxf_base }}"
    state: directory
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0755'
  when: pxf_base != pxf_home

- name: gpadmin 환경변수(PXF_HOME/PXF_BASE, PATH)
  ansible.builtin.blockinfile:
    path: "/home/{{ gpadmin_user }}/.bashrc"
    marker: "# {mark} PXF ANSIBLE"
    block: |
      export PXF_HOME={{ pxf_home }}
      export PXF_BASE={{ pxf_base }}
      export PATH=$PXF_HOME/bin:$PATH
    create: true
    owner: "{{ gpadmin_user }}"
    group: "{{ gpadmin_group }}"
    mode: '0644'

- name: PXF 버전 확인
  become: true
  become_user: "{{ gpadmin_user }}"
  ansible.builtin.command: "{{ pxf_home }}/bin/pxf version"
  register: pxf_version_out
  changed_when: false
  failed_when: false

- name: PXF 버전 출력
  ansible.builtin.debug:
    msg: "{{ pxf_version_out.stdout | default('pxf version 확인 실패') }}"
